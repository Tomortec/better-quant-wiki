version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint-config-next still ships typescript-eslint that cannot load TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
